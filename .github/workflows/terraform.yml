name: Terraform Infrastructure Deployment

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraflow/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraflow/**'
  workflow_dispatch: # Allows manual execution from GitHub UI

jobs:
  terraform:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Format Check
        run: |
          cd terraflow
          terraform fmt -check

      - name: Setup TFLint
        uses: terraform-linters/setup-tfs@v1
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          cd terraflow
          tflint --init
          tflint

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        env:
          TF_VAR_github_pat: ${{ secrets.TF_VAR_github_pat }}
        run: |
          cd terraflow
          terraform init

      - name: Terraform Plan
        env:
          TF_VAR_github_pat: ${{ secrets.TF_VAR_github_pat }}
          TF_VAR_kubeconfig_path: ${{secrets.TF_VAR_kubeconfig_path}}
        run: |
          cd terraflow
          terraform plan -out=tfplan

      - name: Stay alive for debugging
        run: sleep 300

      - name: Terraform Apply
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        env:
          TF_VAR_GITHUB_PAT: ${{ secrets.TF_VAR_github_pat }}
          TF_VAR_kubeconfig_path: ${{secrets.TF_VAR_kubeconfig_path}}
        run: |
          cd terraflow
          terraform apply tfplan
